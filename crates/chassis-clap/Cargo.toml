[package]
name = "chassis-clap"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "CLAP adapter for the Chassis audio framework"

[dependencies]
chassis-runtime.workspace = true
clap-sys = "0.5.0"
clack-plugin.workspace = true
clack-extensions = { workspace = true, features = ["audio-ports", "clack-plugin", "latency", "note-ports", "params", "render", "state", "tail"] }

[lints]
workspace = true

[dev-dependencies]
clack-host.workspace = true
clack-extensions = { workspace = true, features = ["clack-host", "latency", "log"] }
loom = "0.7.2"

[[bench]]
name = "adapter_overhead"
harness = false
