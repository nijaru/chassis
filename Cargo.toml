[workspace]
members = [
    "crates/chassis-runtime",
    "crates/chassis-clap",
    "examples/clap-conformance",
    "examples/clap-delayed-probe",
    "examples/clap-note-probe",
]
exclude = ["vendor/clack/plugin", "vendor/clack/extensions", "vendor/clack/common"]
resolver = "3"

[patch."https://github.com/prokopyl/clack"]
clack-plugin = { path = "vendor/clack/plugin" }
clack-extensions = { path = "vendor/clack/extensions" }
clack-common = { path = "vendor/clack/common" }

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nijaru/chassis"

[workspace.dependencies]
chassis-runtime = { path = "crates/chassis-runtime", version = "0.0.0" }
chassis-clap = { path = "crates/chassis-clap", version = "0.0.0" }
clack-plugin = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a" }
clack-host = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", default-features = false, features = ["clack-plugin"] }
clack-extensions = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
