[workspace]
members = [
    "crates/chassis-core",
    "crates/chassis-clap",
    "examples/clap-conformance",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nijaru/chassis"

[workspace.dependencies]
chassis-core = { path = "crates/chassis-core" }
chassis-clap = { path = "crates/chassis-clap" }
clack-plugin = { git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
