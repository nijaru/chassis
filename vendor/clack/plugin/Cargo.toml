[package]
name = "clack-plugin"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"
repository = "https://github.com/prokopyl/clack"
description = "Low-level, safe Rust wrappers to create audio plugins using the CLAP audio plugin API."
categories = ["api-bindings", "multimedia::audio"]
keywords = ["clap", "audio", "plugin", "host", "bindings"]
authors = ["Adrien Prokopowicz <prokopylmc@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap-sys = "0.5.0"
clack-common = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a" }

[dev-dependencies]
clack-host = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", default-features = false }
clack-extensions = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", features = ["log"] }

[lints.rust]
unsafe-op-in-unsafe-fn = "allow"
missing-docs = "deny"

[lints.clippy]
undocumented-unsafe-blocks = "deny"
cast-possible-truncation = "deny"
cast-possible-wrap = "deny"
cast-precision-loss = "deny"
cast-ptr-alignment = "deny"
cast-sign-loss = "deny"
checked-conversions = "warn"
invalid_upcast_comparisons = "deny"
transmute_ptr_to_ptr = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
