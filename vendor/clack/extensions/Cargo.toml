[package]
name = "clack-extensions"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prokopyl/clack"
description = "A collection of wrappers and utilities for all the standard CLAP extensions, for use with the clack-plugin or clack-host crates."
categories = ["api-bindings", "multimedia::audio"]
keywords = ["clap", "audio", "plugin", "host", "bindings"]
authors = ["Adrien Prokopowicz <prokopylmc@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clack-plugin = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", optional = true }
clack-host = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", optional = true, default-features = false }
clack-common = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a" }
clap-sys = "0.5.0"

bitflags = "2.11.0"
raw-window-handle_05 = { package = "raw-window-handle", version = "0.5.2", optional = true }
raw-window-handle_06 = { package = "raw-window-handle", version = "0.6.0", optional = true }

[dev-dependencies]
clack-host = { version = "0.2.0", git = "https://github.com/prokopyl/clack", rev = "c5975f9f89f0953b00768680357985d46178078a", features = ["clack-plugin"] }
static_assertions = "1.1.0"

[features]
all-extensions = [
    "ambisonic",
    "audio-ports",
    "audio-ports-activation",
    "audio-ports-config",
    "clap-wrapper",
    "configurable-audio-ports",
    "context-menu",
    "event-registry",
    "gui",
    "latency",
    "log",
    "note-name",
    "note-ports",
    "params",
    "param-indication",
    "posix-fd",
    "preset-discovery",
    "remote-controls",
    "render",
    "state",
    "state-context",
    "surround",
    "tail",
    "thread-check",
    "thread-pool",
    "timer",
    "track-info",
    "voice-info"
]
ambisonic = ["audio-ports"]
audio-ports = []
audio-ports-activation = []
audio-ports-config = ["audio-ports"]
context-menu = []
clap-wrapper = []
configurable-audio-ports = ["audio-ports"]
event-registry = []
gui = []
latency = []
log = []
note-name = []
note-ports = []
params = []
param-indication = []
posix-fd = []
preset-discovery = []
remote-controls = []
render = []
state = []
state-context = ["state"]
surround = ["audio-ports"]
tail = []
thread-check = []
thread-pool = []
timer = []
track-info = ["audio-ports"]
voice-info = []

[lints.rust]
unsafe-op-in-unsafe-fn = "allow"
missing-docs = "deny"

[lints.clippy]
undocumented-unsafe-blocks = "deny"
cast-possible-truncation = "deny"
cast-possible-wrap = "deny"
cast-precision-loss = "deny"
cast-ptr-alignment = "deny"
cast-sign-loss = "deny"
checked-conversions = "warn"
invalid_upcast_comparisons = "deny"
transmute_ptr_to_ptr = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
