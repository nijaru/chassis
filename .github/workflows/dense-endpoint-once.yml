name: Dense Endpoint Migration Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Make audio endpoints dense-only
        run: python3 .github/dense_endpoint_migrate.py
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Test workspace
        run: cargo +1.98.0 test --workspace
      - name: Remove migration scaffolding
        run: rm .github/workflows/dense-endpoint-once.yml .github/dense_endpoint_migrate.py .github/dense-endpoint-trigger
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "refactor(core): make audio endpoints dense-only"
          git push origin HEAD:main
