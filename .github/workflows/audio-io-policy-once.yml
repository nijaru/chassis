name: Audio IO Policy Migration Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Prepare migration anchor
        run: python3 .github/audio_io_policy_fix.py before
      - name: Apply migration
        run: python3 .github/audio_io_policy_migrate.py
      - name: Restore fixture naming
        run: python3 .github/audio_io_policy_fix.py after
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Test workspace
        run: cargo +1.98.0 test --workspace
      - name: Lint workspace
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Remove migration scaffolding
        run: rm .github/workflows/audio-io-policy-once.yml .github/audio_io_policy_migrate.py .github/audio_io_policy_fix.py
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat(core): add whole audio IO policy"
          git push origin HEAD:main
