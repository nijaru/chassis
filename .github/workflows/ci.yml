name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked

  loom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Model publication ordering
        run: cargo +1.98.0 test -p chassis-clap --test publication_loom --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Lint workspace
        run: cargo +1.98.0 clippy --workspace --all-features --all-targets --locked -- -D warnings
