name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked

  portable-test:
    name: portable-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked
      - name: Check all targets and features
        run: cargo +1.98.0 check --workspace --all-features --all-targets --locked

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install dependency policy tools
        run: |
          cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
          cargo +1.98.0 install cargo-machete --version 0.9.2 --locked
      - name: Audit advisories, licenses, bans, and sources
        run: cargo deny check
      - name: Detect unused dependencies
        run: cargo machete

  loom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Model publication ordering
        run: cargo +1.98.0 test -p chassis-clap --test publication_loom --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Lint workspace
        run: cargo +1.98.0 clippy --workspace --all-features --all-targets --locked -- -D warnings
