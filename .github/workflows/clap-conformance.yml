name: CLAP Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAP_VALIDATOR_REV: b2f1d9b79b1d264a5747f46707d72b1aa40a02ef

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build conformance plugin
        run: cargo +1.98.0 build --release -p chassis-clap-conformance --locked

      - name: Package Linux CLAP
        run: cp target/release/libchassis_clap_conformance.so target/release/chassis-clap-conformance.clap

      - name: Build pinned clap-validator
        run: >-
          cargo +1.98.0 install
          --git https://github.com/free-audio/clap-validator
          --rev "$CLAP_VALIDATOR_REV"
          --locked
          clap-validator

      - name: Validate CLAP
        run: clap-validator validate target/release/chassis-clap-conformance.clap

      - name: Bounded CLAP fuzz
        run: clap-validator fuzz -j2 -d5s target/release/chassis-clap-conformance.clap
