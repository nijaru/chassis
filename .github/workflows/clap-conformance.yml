name: CLAP Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAP_VALIDATOR_REV: b2f1d9b79b1d264a5747f46707d72b1aa40a02ef

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build qualification plugins
        run: cargo +1.98.0 build --workspace --release --locked

      - name: Package native CLAPs
        run: bash .github/scripts/package-clap.sh

      - name: Build pinned clap-validator
        run: bash .github/scripts/install-clap-validator.sh "$CLAP_VALIDATOR_REV"

      - name: Validate CLAPs
        run: |
          for name in chassis-clap-conformance chassis-delayed-probe chassis-note-probe; do
            target/clap-validator/bin/clap-validator validate "target/release/$name.clap"
          done

      - name: Bounded CLAP fuzz
        run: |
          for name in chassis-clap-conformance chassis-delayed-probe chassis-note-probe; do
            target/clap-validator/bin/clap-validator fuzz -j2 -d5s "target/release/$name.clap"
          done
